name: Build Docker Image

on:
  workflow_call:
    inputs:
      OWNER_LC:
        description: "repo owner name"
        type: string
        required: true
      BENCHMARK:
        type: boolean
        default: false
jobs:
  build-docker-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to GHCR
        if: ${{ !inputs.BENCHMARK }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: ${{ !inputs.BENCHMARK }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest

      - name: Verify benchmark container exists
        if: inputs.BENCHMARK
        run: docker manifest inspect "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" > /dev/null
