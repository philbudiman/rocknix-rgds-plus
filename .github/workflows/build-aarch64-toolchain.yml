name: Build toolchain

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string
      BASEOS:
        description: "build RG DS Plus BaseOS without EmulationStation"
        type: boolean
        default: false
      SUSPEND:
        description: "include stock BL31 suspend configuration and sleep rails"
        type: boolean
        default: true
      CACHE_TOOLCHAIN:
        description: "reuse the built RK3566 BaseOS toolchain"
        type: boolean
        default: true
      SAVE_CCACHE:
        type: boolean
        default: true

jobs:
  build-aarch64-toolchain:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      JAVA_HOME: /usr
      AUTOREMOVE: "yes"
      AUTOREMOVE_BLOCK: "gcc glibc libtool flex"
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      BASEOS: ${{ inputs.BASEOS && 'yes' || 'no' }}
      BASE_ONLY: ${{ inputs.BASEOS && 'true' || 'false' }}
      DS_ONLY: "false"
      SUSPEND: ${{ inputs.SUSPEND }}
      ARCH: aarch64
      CACHE_KEY: ccache-aarch64-${{ inputs.DEVICE }}-toolchain-${{ github.sha }}
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure diagnostic suspend variant
        if: inputs.BASEOS && !inputs.SUSPEND
        run: python3 rocknix/disable-suspend.py .

      - name: Calculate toolchain cache key
        if: inputs.CACHE_TOOLCHAIN && inputs.BASEOS && inputs.DEVICE == 'RK3566'
        id: toolchain-key
        run: |
          ./scripts/get_env > .env
          key=$(docker run --init --env-file .env --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:$PWD" -w "$PWD" "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
            bash .github/scripts/toolchain-cache-key.sh toolchain alsa-lib llvm:host)
          [[ "$key" =~ ^[0-9a-f]{64}$ ]]
          echo "key=toolchain-v1-${{ runner.os }}-${{ runner.arch }}-$key" >> "$GITHUB_OUTPUT"

      - name: Restore built toolchain
        if: steps.toolchain-key.outputs.key != ''
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: build.aarch64-toolchain.tar.zst
          key: ${{ steps.toolchain-key.outputs.key }}

      - name: Retrieve ccache
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          URL="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache/ccache-aarch64-${{ inputs.DEVICE }}-toolchain.tar"
          curl -L --fail --silent --show-error "$URL" | tar -xvf - || echo "Cache archive not found, skipping."            

      - name: Build
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_mt toolchain alsa-lib llvm:host"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-toolchain)
        if: failure() || (!inputs.SAVE_CCACHE && steps.toolchain-cache.outputs.cache-hit != 'true')
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-toolchain)
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Build llvm:target
        if: ${{ steps.toolchain-cache.outputs.cache-hit != 'true' && (inputs.DEVICE == 'SM8250' || inputs.DEVICE == 'SM8550' || inputs.DEVICE == 'SM8650' || inputs.DEVICE == 'SM8750') }}
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_mt llvm:target "; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-llvm)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs-${{ inputs.DEVICE }}-llvm
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Clean ccache
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          export CCACHE_DIR=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -M 500M
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -c
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -z

      - name: Tar ccache
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          tar --remove-files -cf ccache-aarch64-${{ inputs.DEVICE }}-toolchain.tar ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache  

      - name: Save ccache
        if: inputs.SAVE_CCACHE && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ccache
          files: ccache-aarch64-${{ inputs.DEVICE }}-toolchain.tar
          make_latest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - name: Compress directory
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          tar --zstd -cf build.aarch64-toolchain.tar.zst \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/build \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/install_* \
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.stamps
      - name: Save built toolchain
        if: steps.toolchain-key.outputs.key != '' && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build.aarch64-toolchain.tar.zst
          key: ${{ steps.toolchain-key.outputs.key }}

      - name: Report toolchain reuse
        env:
          CACHE_HIT: ${{ steps.toolchain-cache.outputs.cache-hit == 'true' }}
          CACHE_KEY: ${{ steps.toolchain-key.outputs.key }}
        run: |
          echo "Built toolchain cache hit: $CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Cache key: ${CACHE_KEY:-disabled}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: aarch64-toolchain (${{ inputs.DEVICE }})
          path: build.aarch64-toolchain.tar.zst
          compression-level: 0
          if-no-files-found: error
